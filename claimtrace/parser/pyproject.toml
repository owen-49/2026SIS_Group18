[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claimtrace-parser"
version = "0.1.0"
description = "Document Intelligence — PDF parsing and structure recovery for academic papers"
requires-python = ">=3.11"
dependencies = [
    # Shared by reference extraction and PDF-to-Markdown conversion.
    "opendataloader-pdf>=2.5.0,<3.0",
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.10.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["parser*"]
