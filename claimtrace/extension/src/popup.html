<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ClaimTrace</title>

  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    h1 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    p {
      color: #666;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .status {
      padding: 8px;
      background: #f0fdf4;
      border-radius: 6px;
      color: #16a34a;
      font-size: 12px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    #pageTitle {
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 8px;
    }

    #pageContent {
      max-height: 180px;
      overflow-y: auto;
      background: #f5f5f5;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>ClaimTrace</h1>

  <p>
    Citation audit for Overleaf.
    Hover over <code>\cite{...}</code> to verify.
  </p>

  <div class="status">
    ✓ Active on this page
  </div>

  <button id="readPageBtn">
    Read Current Page
  </button>

  <div id="readStatus">
    Waiting to read page...
  </div>

  <p id="pageTitle"></p>

  <div id="citationResult"></div>

  <div id="pageContent"></div>

  <script src="popup.js"></script>

</body>
</html>
