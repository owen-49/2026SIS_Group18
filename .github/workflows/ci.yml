# ClaimTrace — GitHub Actions CI

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parser:
    name: Parser Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claimtrace/parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        # The parser package is flat: code lives in parser/parser/, not src/.
        run: ruff check parser/ tests/
      - name: Test
        run: pytest --cov=parser --cov-report=term

  engine:
    name: Engine Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claimtrace/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        # The engine package is flat: code lives in engine/engine/, not src/.
        run: ruff check engine/ tests/
      - name: Test
        # PYTHONPATH=.. makes the ClaimTrace application root importable, which
        # tests/test_google_scholar_lookup.py needs for `backend.src.audit_models`.
        run: PYTHONPATH=.. pytest --cov=engine --cov-report=term

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claimtrace/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser + engine
        run: |
          pip install -e ../parser/
          pip install -e ../engine/
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Test
        # Tests import `backend.src`, so the ClaimTrace application root must be importable.
        run: PYTHONPATH=.. pytest --cov=src --cov-report=term

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claimtrace/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
